{% extends "core/base.html" %}

{% block title %}Edit comment — LaunchPad{% endblock %}

{% block content %}

<header class="page-intro form-layout">
    <div class="page-intro__copy">
        <p class="eyebrow">Discussion</p>
        <h1>Refine your note.</h1>
        <p class="lede">Update your comment on <strong>{{ comment.project.title }}</strong>.</p>
    </div>
</header>

<section class="panel form-card form-layout">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="button-row">
            <button type="submit">Save changes</button>
            <a class="button button--secondary" href="{% url 'project_detail' comment.project.pk %}">Cancel</a>
        </div>
    </form>
</section>

{% endblock %}
