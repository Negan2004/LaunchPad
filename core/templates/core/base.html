<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LaunchPad{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fa;
            color: #222;
        }

        nav {
            background: #111827;
            padding: 15px 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        button,
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>

<body>

<nav>
    <a href="{% url 'home' %}">LaunchPad</a>
    <a href="{% url 'project_list' %}">Projects</a>

    {% if user.is_authenticated %}
        <a href="{% url 'create_project' %}">Create Project</a>
        <a href="{% url 'edit_profile' %}">Profile</a>
    {% endif %}
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
